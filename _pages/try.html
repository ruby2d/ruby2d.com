---
title: Try Ruby 2D
description: Write Ruby 2D code and run it right in your browser. No install required.
layout: main
permalink: /try
---

<div class="max-w-[1120px] mx-auto px-4 sm:px-6 py-8">

  <!-- Playground -->
  <div class="try-playground">

    <!-- Top/Left: Tutorial panel -->
    <div class="try-playground-sidebar">
      <div class="bg-[var(--surface-card)] border-2 border-[var(--surface-border)] rounded-xl p-5">
        <div class="flex items-center justify-between mb-3">
          <h2 class="font-fredoka font-semibold text-[1rem] text-[var(--text-muted)] uppercase tracking-wider">Tutorial</h2>
          <span id="stepCount" class="text-sm font-semibold text-[var(--text-muted)]"></span>
        </div>
        <div id="stepChips" class="try-step-chips"></div>
        <div id="stepProse" class="try-step-prose"></div>
        <div class="try-step-nav">
          <button id="prevBtn" onclick="prevStep()" class="try-step-btn"><svg class="w-3 h-3 shrink-0" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 2.5L4 6l3.5 3.5"/></svg>Back</button>
          <button id="nextBtn" onclick="nextStep()" class="try-step-btn try-step-btn-primary">Next<svg class="w-3 h-3 shrink-0" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg></button>
        </div>
      </div>
    </div>

    <!-- Right: Canvas + editor -->
    <div class="flex-1 min-w-0">

      <!-- Canvas -->
      <div class="try-canvas-container relative">
        <canvas id="canvas" class="try-canvas" width="640" height="480" tabindex="0"></canvas>
        <div class="try-loading-overlay" id="loadingOverlay">
          <div class="try-spinner"></div>
          Loading…
        </div>
      </div>

      <!-- Editor -->
      <div class="try-editor-wrap mt-4">
        <div class="try-editor-prism">
          <pre class="language-ruby"><code class="language-ruby" id="editorHighlight"></code></pre>
          <textarea id="editor" class="try-editor" spellcheck="false"></textarea>
        </div>
      </div>

      <!-- Controls -->
      <div class="flex items-center gap-3 mt-3">
        <button
          id="runBtn"
          disabled
          onclick="runCode()"
          title="Run (⌘Enter / Ctrl+Enter)"
          class="inline-flex items-center gap-2 px-5 py-2 rounded-full font-semibold text-sm text-white bg-[var(--ruby-red)] shadow-[0_2px_8px_rgba(255,71,87,0.35)] hover:opacity-90 hover:-translate-y-0.5 active:translate-y-0 transition-all cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed disabled:translate-y-0"
        >Run<svg class="w-2.5 h-2.5 shrink-0" viewBox="0 0 12 12" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" aria-hidden="true"><path d="M3.2 2.4L9.4 6L3.2 9.6Z"/></svg></button>
        <button
          id="consoleBtn"
          onclick="toggleConsole()"
          class="px-4 py-2 rounded-full font-semibold text-sm text-[var(--text-secondary)] bg-[var(--surface-raised)] border-2 border-[var(--surface-border)] hover:border-[var(--ruby-red)] hover:text-[var(--ruby-red)] transition-colors cursor-pointer"
        >Show Console</button>
      </div>

      <!-- Console -->
      <div id="consolePanel" class="mt-2 hidden">
        <div id="consoleOutput" class="try-console-output"></div>
      </div>

    </div>
  </div>

</div>

<script>window.Prism = {manual: true};</script>
<script src="/assets/js/prism.min.js"></script>
<script src="/assets/try/playground.js"></script>
<script src="/assets/try/try.js"></script>
<script async src="/assets/try/app.js"></script>
